name: E2E

# Separado do CI principal para não deixá-lo lento: roda a cada push na main e sob demanda.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (fluxo principal, desktop e Pixel 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduspace
          POSTGRES_PASSWORD: eduspace_ci
          POSTGRES_DB: eduspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eduspace -d eduspace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://eduspace:eduspace_ci@localhost:5432/eduspace_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dependências do backend
        working-directory: backend
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências do frontend e Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npm run e2e
      - name: Relatório, traces e vídeos das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
