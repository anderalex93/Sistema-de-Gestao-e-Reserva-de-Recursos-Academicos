name: Tarefa técnica
description: Infraestrutura, documentação, testes ou manutenção sem mudança visível para o usuário
labels: []
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo
      options:
        - Infraestrutura / CI / deploy
        - Documentação
        - Testes
        - Refatoração
        - Gestão / Scrum
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: O que precisa ser feito e por quê.
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: bloqueios
    attributes:
      label: Bloqueado por
