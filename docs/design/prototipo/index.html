<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo EduSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block">
<style>
/*
 * Protótipo navegável do EduSpace (issue #14).
 * Layout: índice de telas à esquerda, palco com a moldura do aparelho (360px ou 1280px) no centro.
 * Tokens: docs/design/design-system.md, cores oficiais da UMJ. O produto ainda não tem tema escuro
 * (fica para depois do MVP), então o protótipo mostra só o tema claro, de propósito.
 */
:root {
  color-scheme: light;
  --paper: #F5F7FA;
  --surface: #FCFDFE;
  --sunken: #E6E9EF;
  --hatch: #D5DBE4;
  --ink: #041C40;
  --ink-muted: #596370;
  --ink-disabled: #83929B;
  --line: #D5DBE4;
  --line-strong: #7A8794;
  --primary: #2F52A0;
  --primary-hover: #24417F;
  --primary-tint: #E3E9F5;
  --brand-accent: #23B9D6;
  --error: #B91C1C;
  --warning: #92400E;
  --success: #1A7F37;
  --scrim: rgba(4, 28, 64, 0.48);

  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --font-data: "Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;

  --radius: 2px;
  --hatch-pattern: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 8px);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.625 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ms {
  font-family: "Material Symbols Sharp";
  font-weight: normal; font-style: normal; font-size: 20px; line-height: 1;
  letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
  display: inline-block; vertical-align: middle; flex-shrink: 0;
  font-feature-settings: "liga"; -webkit-font-feature-settings: "liga";
  overflow: hidden; width: 1em;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

/* ---------- Moldura do protótipo ---------- */
.proto { min-height: 100vh; display: flex; flex-direction: column; }
.proto-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding: 12px 16px; background: var(--ink); color: var(--paper);
}
.proto-bar h1 { margin: 0; font: 500 20px/1.3 var(--font-display); }
.proto-bar h1 small { display: block; font: 400 13px/1.4 var(--font-ui); color: var(--hatch); }
.proto-bar .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.seg button {
  border: 0; background: transparent; color: var(--paper); padding: 8px 14px; min-height: 40px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
}
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 700; }
.proto-next {
  border: 1px solid var(--brand-accent); color: var(--paper); background: transparent; border-radius: var(--radius);
  padding: 8px 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 700;
}
.proto-main { flex: 1; display: grid; grid-template-columns: 264px minmax(0, 1fr); }
.proto-index {
  border-right: 1px solid var(--line); background: var(--surface); padding: 16px 0;
  max-height: calc(100vh - 64px); overflow: auto; position: sticky; top: 0;
}
.proto-index h2 { margin: 16px 16px 4px; font: 700 12px/16px var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
.proto-index h2:first-child { margin-top: 0; }
.proto-index a {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 6px 16px; color: var(--ink); text-decoration: none; font-size: 15px;
}
.proto-index a:hover { background: var(--sunken); }
.proto-index a[aria-current="page"] { background: var(--primary-tint); color: var(--primary); font-weight: 700; }
.proto-index a .tag { font: 500 12px var(--font-data); color: var(--ink-muted); }
.proto-select { display: none; }
.proto-select select { width: 100%; min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--surface); padding: 0 12px; }
.stage { min-width: 0; padding: 20px 24px 40px; display: flex; flex-direction: column; gap: 16px; }
.stage-meta { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between; }
.stage-meta h2 { margin: 0; font: 500 24px/32px var(--font-display); text-wrap: balance; }
.stage-meta .crumb { font: 700 12px/16px var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
.variants { display: flex; flex-wrap: wrap; gap: 8px; }
.variants button {
  min-height: 36px; padding: 4px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius);
  background: var(--surface); cursor: pointer;
}
.variants button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--paper); font-weight: 700; }
.frame-wrap { position: relative; }
.device {
  position: relative; overflow: hidden; background: var(--paper);
  border: 1px solid var(--line-strong); transform-origin: top left;
}
.device-scroll { height: 100%; overflow: auto; }
.notes { max-width: 70ch; margin: 0; color: var(--ink-muted); font-size: 15px; }
.notes strong { color: var(--ink); }

@media (max-width: 860px) {
  .proto-main { grid-template-columns: minmax(0, 1fr); }
  .proto-index { display: none; }
  .proto-select { display: block; }
  .stage { padding: 16px; }
}

/* ---------- Componentes do app (tokens do design system) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: var(--radius); border: 1px solid transparent;
  font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: var(--paper); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outlined { background: transparent; border-color: var(--line-strong); color: var(--ink); }
.btn-outlined:hover { background: var(--sunken); }
.btn-danger { background: transparent; border-color: var(--error); color: var(--error); }
.btn-danger-fill { background: var(--error); color: var(--paper); }
.btn-text { background: transparent; color: var(--primary); padding: 0 8px; }
.btn-text:hover { text-decoration: underline; }
.btn[aria-disabled="true"] { color: var(--ink-disabled); border-color: var(--line); cursor: not-allowed; }
.btn-block { width: 100%; }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; border: 1px solid var(--line);
  border-radius: var(--radius); background: transparent; cursor: pointer;
}
.icon-btn[disabled] { color: var(--ink-disabled); cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .label { font: 700 14px/20px var(--font-ui); }
.input, .select, .textarea {
  min-height: 44px; width: 100%; padding: 0 12px; border: 1px solid var(--line-strong);
  border-radius: var(--radius); background: var(--surface);
}
.textarea { min-height: 88px; padding: 10px 12px; resize: vertical; }
.select { appearance: none; padding-right: 36px; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.input-wrap { position: relative; display: flex; align-items: center; }
.input-wrap .ms { position: absolute; left: 12px; color: var(--ink-muted); }
.input-wrap .input { padding-left: 40px; }
.input-wrap .trail { position: absolute; right: 4px; border: 0; background: transparent; width: 40px; height: 40px; cursor: pointer; }
.field.has-error .input { border-color: var(--error); border-width: 2px; }
.help { font-size: 14px; line-height: 22px; color: var(--ink-muted); }
.err { display: flex; gap: 6px; align-items: flex-start; font-size: 14px; line-height: 20px; color: var(--error); }
.err .ms { font-size: 16px; margin-top: 2px; }
.alert { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--error); border-radius: var(--radius); padding: 10px 12px; color: var(--error); background: var(--surface); }
.alert.info { border-color: var(--primary); color: var(--ink); }
.alert.info .ms { color: var(--primary); }

.chip {
  display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; background: transparent;
}
.chip.toggle { min-height: 36px; padding: 0 12px; border-color: var(--line-strong); cursor: pointer; font-size: 14px; }
.chip.toggle[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--paper); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }

.overline { font: 700 12px/16px var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
.h1 { margin: 0; font: 500 32px/40px var(--font-display); text-wrap: balance; }
.h2 { margin: 0; font: 500 24px/32px var(--font-display); text-wrap: balance; }
.h3 { margin: 0; font: 700 18px/26px var(--font-ui); }
.muted { color: var(--ink-muted); }
.small { font-size: 14px; line-height: 22px; }
.data { font-family: var(--font-data); font-weight: 500; font-variant-numeric: tabular-nums; }
.panel { border: 1px solid var(--line); background: var(--surface); padding: 24px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.page-head { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.page-head .main { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.page-head .main > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; color: var(--ink-muted); list-style: none; margin: 0; padding: 0; }
.crumbs li + li::before { content: "/"; margin-right: 6px; }
.crumbs a { color: var(--ink-muted); }
.crumbs [aria-current] { color: var(--ink); font-weight: 700; }

dl.pairs { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 24px; }
dl.pairs dt { color: var(--ink-muted); }
dl.pairs dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
/* No celular o par empilha, como no app (DetailList). */
.is-mobile dl.pairs { grid-template-columns: 1fr; gap: 2px; }
.is-mobile dl.pairs dt:not(:first-child) { margin-top: 10px; }

.status { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/16px var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; }
.status .ms { font-size: 16px; }
.status.large { font-size: 16px; line-height: 24px; }
.status.large .ms { font-size: 24px; }
.status.ok { color: var(--success); }
.status.cancel { color: var(--error); }
.status.done { color: var(--ink-muted); }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { border: 0; background: transparent; min-height: 48px; padding: 0 16px; cursor: pointer; font-weight: 500; color: var(--ink-muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--primary); font-weight: 700; border-bottom-color: var(--primary); }

.skel { background: var(--sunken); display: block; }
.skel-pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }

table.tbl { width: 100%; border-collapse: collapse; background: var(--surface); }
table.tbl th, table.tbl td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tbl thead th { background: var(--sunken); font-weight: 700; font-size: 14px; white-space: nowrap; }
.tbl-wrap { border: 1px solid var(--line); overflow-x: auto; }

/* Shell do app: celular */
.m-app { min-height: 100%; display: flex; flex-direction: column; }
.m-top { position: sticky; top: 0; z-index: 10; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.m-main { flex: 1; padding: 24px 16px 32px; }
.m-bottom { position: sticky; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); height: 64px; background: var(--surface); border-top: 1px solid var(--line); }
.m-bottom a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; color: var(--ink-muted); text-decoration: none; border-top: 2px solid transparent; }
.m-bottom a .ms { font-size: 24px; }
.m-bottom a[aria-current="page"] { color: var(--primary); font-weight: 700; border-top-color: var(--primary); }
.m-sumbar { position: sticky; bottom: 64px; z-index: 15; background: var(--surface); border-top: 1px solid var(--line-strong); padding: 12px 16px; }

/* Shell do app: desktop */
.d-app { min-height: 100%; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
.d-side { border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; height: 800px; padding: 0 12px; }
.d-side .brand { height: 56px; }
.d-side nav { display: flex; flex-direction: column; gap: 2px; margin-top: 16px; }
.d-side nav a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; color: var(--ink); text-decoration: none; border-radius: var(--radius); }
.d-side nav a .ms { font-size: 24px; }
.d-side nav a:hover { background: var(--sunken); }
.d-side nav a[aria-current="page"] { background: var(--primary-tint); color: var(--primary); font-weight: 700; }
.d-top { position: sticky; top: 0; z-index: 10; height: 56px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--line); }
.d-main { padding: 32px; }
.d-inner { max-width: 1200px; margin: 0 auto; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 17px; }
.brand-mark { width: 32px; height: 32px; display: grid; place-items: center; background: var(--ink); color: var(--brand-accent); font: 600 18px var(--font-display); }

/* Shell público */
.p-app { min-height: 100%; display: flex; flex-direction: column; }
.p-top { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.p-main { flex: 1; width: 100%; margin: 0 auto; padding: 32px 16px 48px; }
.p-foot { border-top: 1px solid var(--line); background: var(--surface); padding: 24px 16px; font-size: 14px; display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; }
.p-foot nav { display: flex; flex-wrap: wrap; gap: 8px 16px; }

/* Cards de recurso */
.res-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; margin: 0; padding: 0; list-style: none; }
.res-card { display: flex; flex-direction: column; gap: 12px; height: 100%; padding: 20px; border: 1px solid var(--line); background: var(--surface); color: inherit; text-decoration: none; }
.res-card:hover { background: var(--sunken); border-color: var(--line-strong); }
.res-type { display: flex; gap: 8px; align-items: center; color: var(--ink-muted); }

/* Grade de horários */
.slots { list-style: none; margin: 0; padding: 0; }
.slot { width: 100%; min-height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border: 1px solid var(--line); margin-top: -1px; background: var(--surface); cursor: pointer; text-align: left; }
.slot:hover { background: var(--primary-tint); }
.slot .t { font-family: var(--font-data); font-weight: 500; min-width: 48px; }
.slot .s { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; }
.slot.busy { background-color: var(--surface); background-image: var(--hatch-pattern); cursor: not-allowed; }
.slot.mine { background-color: var(--primary-tint); background-image: var(--hatch-pattern); cursor: not-allowed; }
.slot.past { background: var(--sunken); color: var(--ink-disabled); cursor: not-allowed; }
.slot.sel { background: var(--primary); border-color: var(--primary); color: var(--paper); }
.slot.sel .s { font-weight: 700; }
.slot-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 12px; padding: 0; list-style: none; font-size: 14px; }
.slot-legend li { display: flex; gap: 8px; align-items: center; }
.sw { width: 18px; height: 18px; border: 1px solid var(--line); display: inline-block; }

/* Quadro */
.board { border-collapse: collapse; table-layout: fixed; }
.board th, .board td { border: 1px solid var(--line); padding: 0; }
.board thead th { background: var(--sunken); font: 500 12px var(--font-data); height: 32px; }
.board th[scope="row"] { text-align: left; padding: 6px 12px; background: var(--surface); position: sticky; left: 0; }
.board td { height: 44px; }
.board td.busy { background: var(--surface) var(--hatch-pattern); text-align: center; }
.board td.mine { background: var(--primary-tint) var(--hatch-pattern); text-align: center; }
.board td.past { background: var(--sunken); }
.board td.free { background: var(--surface); }

/* Sobreposições dentro do aparelho */
.overlay { position: absolute; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; }
.overlay.sheet { align-items: flex-end; padding: 0; }
.dialog { width: 100%; max-width: 560px; max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); }
.dialog.xs { max-width: 420px; }
.dialog h2 { margin: 0; padding: 20px 24px 8px; font: 500 22px/30px var(--font-display); }
.dialog .body { padding: 8px 24px 16px; display: flex; flex-direction: column; gap: 16px; }
.dialog .actions { padding: 8px 24px 24px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.sheet .dialog { max-width: none; max-height: 90%; border-width: 1px 0 0; }
.snack { position: absolute; left: 16px; bottom: 16px; z-index: 50; max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--ink); color: var(--paper); border-radius: var(--radius); font-size: 15px; }
.snack.m { bottom: 80px; }
.snack button { border: 0; background: transparent; color: var(--paper); cursor: pointer; }

.qr { width: 160px; height: 160px; background: var(--surface); }
.qr img, .qr canvas { width: 160px !important; height: 160px !important; image-rendering: pixelated; }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; display: grid; gap: 16px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.steps li::before { content: counter(s); width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--ink); font: 500 18px var(--font-display); }
details.faq { border-top: 1px solid var(--line); padding: 12px 0; }
details.faq summary { cursor: pointer; font-weight: 700; }
.photo { aspect-ratio: 4 / 3; max-width: 100%; background: var(--sunken); display: grid; place-items: center; color: var(--ink-muted); font-size: 14px; text-align: center; padding: 12px; border: 1px dashed var(--line-strong); }
</style>
</head>
<body>
<div class="proto">
  <header class="proto-bar">
    <h1>Protótipo EduSpace<small>Telas do MVP, navegáveis. Clique nos botões e links dentro do aparelho.</small></h1>
    <span class="spacer"></span>
    <div class="seg" role="group" aria-label="Tamanho da tela">
      <button type="button" id="dev-mobile" data-device="mobile"><span class="ms" aria-hidden="true">smartphone</span>Celular 360</button>
      <button type="button" id="dev-desktop" data-device="desktop"><span class="ms" aria-hidden="true">desktop_windows</span>Desktop 1280</button>
    </div>
    <button type="button" class="proto-next" id="flow-next"><span>Próxima no fluxo</span><span class="ms" aria-hidden="true">arrow_forward</span></button>
  </header>
  <div class="proto-main">
    <nav class="proto-index" id="index" aria-label="Telas do protótipo"></nav>
    <div class="stage">
      <div class="proto-select"><label class="sr" for="screen-select">Tela</label><select id="screen-select"></select></div>
      <div class="stage-meta">
        <div><div class="crumb" id="meta-group"></div><h2 id="meta-title"></h2></div>
        <div class="variants" id="variants" role="group" aria-label="Estados da tela"></div>
      </div>
      <div class="frame-wrap" id="frame-wrap">
        <div class="device" id="device" role="region" aria-label="Tela do aparelho">
          <div class="device-scroll" id="screen"></div>
          <div id="layer"></div>
        </div>
      </div>
      <p class="notes" id="notes"></p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- Dados de exemplo (catálogo do seed, persona Lucas) ---------- */
  var TODAY = 'ter, 20 de out';
  var DAY = 'qua, 21 de out';

      catch (e) { el.textContent = 'QR code'; }

  function fit() {
    var w = state.device === 'mobile' ? 360 : 1280;
    var h = state.device === 'mobile' ? 740 : 800;
    var avail = wrap.clientWidth;
    var scale = Math.min(1, avail / w);
    device.classList.toggle('is-mobile', state.device === 'mobile');
    device.style.width = w + 'px';
    device.style.height = h + 'px';
    device.style.transform = scale < 1 ? 'scale(' + scale + ')' : 'none';
    wrap.style.height = Math.ceil(h * scale) + 'px';

  device.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act],[data-slot],[data-tab],[data-chip]');

      if (ev.target.classList && ev.target.classList.contains('overlay')) { state.overlay = null; render(); }
      return;
    }
    if (t.dataset.slot !== undefined) {
      var i = Number(t.dataset.slot);
      if (t.getAttribute('aria-disabled') === 'true') return;
      var sel = state.sel;
      state.hint = null;
      if (sel && sel[0] === sel[1] && i === sel[0]) state.sel = null;
      else if (sel && sel[0] === sel[1] && i > sel[0]) {
        var blocked = false;
        for (var k = sel[0]; k <= i; k++) if (slotState(k, state.variant === 1) !== 'free') blocked = true;
        if (i - sel[0] + 1 > 8) { state.hint = 'Cada reserva pode ter no máximo 4h.'; }
        else state.sel = blocked ? [i, i] : [sel[0], i];
      } else state.sel = [i, i];
      render(); return;
    }
    if (t.dataset.tab !== undefined) { state.tab = Number(t.dataset.tab); render(); return; }
    if (t.dataset.chip !== undefined) { state.chips[t.dataset.chip] = !state.chips[t.dataset.chip]; render(); return; }

    if (act === 'drawer') { state.overlay = 'drawer'; render(); return; }
    if (act === 'resumo') { state.overlay = 'resumo'; render(); return; }
    if (act === 'clear') { state.sel = null; render(); return; }

    }
  });
  device.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var act = ev.target.dataset.act;
    if (act === 'login' && state.variant !== 1) location.hash = 'inicio';
    else if (act === 'signup' && state.variant !== 1) { state.snack = null; location.hash = 'inicio'; }
  });

  document.getElementById('variants').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-variant]');
    if (!b) return;
    state.variant = Number(b.dataset.variant);
    state.overlay = null;
    if (state.route === 'reservas') state.tab = state.variant === 1 ? 1 : 0;
    render();
  });
  document.querySelectorAll('[data-device]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.device = b.dataset.device;
      try { localStorage.setItem('eduspace-proto-device', state.device); } catch (e) { /* sem storage */ }
      render();
    });
  });
  document.getElementById('flow-next').addEventListener('click', function () {
    var i = FLOW.indexOf(state.route);
    location.hash = FLOW[(i + 1) % FLOW.length];
  });
  window.addEventListener('hashchange', function () { enterRoute(location.hash.slice(1)); });
  // Só a largura importa: reagir à altura que o próprio fit() define entraria em laço.
  var lastWidth = 0;
  function onResize() { if (wrap.clientWidth !== lastWidth) { lastWidth = wrap.clientWidth; fit(); } }
  window.addEventListener('resize', onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(wrap);

  buildIndex();
  enterRoute(location.hash.slice(1) || 'landing');
})();
</script>
</body>
</html>
