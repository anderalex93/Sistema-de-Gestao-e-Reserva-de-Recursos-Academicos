name: eduspace

services:
  db:
    image: postgres:16-alpine
    container_name: eduspace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduspace_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eduspace}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-eduspace_test}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - eduspace-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  eduspace-pgdata:
